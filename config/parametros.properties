# =====================================================================
# Parámetros configurables de PaqRap (se leen al iniciar el programa).
# Si este archivo no existe, se usan los valores del enunciado.
# Las capacidades (24/8/4) y los costos por km (8/6/3) NO se configuran
# aquí porque son datos del caso.
# =====================================================================

# --- Velocidad promedio por tipo de vehículo (km/h) ---
# Valores del enunciado. La hoja auxiliar del profesor (marcada REVISAR)
# muestra 20 / 40 / 14; cambiar aquí si el profesor lo confirma.
velocidad.AUTO=40
velocidad.MOTO=25
velocidad.BICICLETA=12

# --- Semáforo de % de pedidos en plazo (RNF d) ---
# verde si % >= umbral_verde; ámbar si % >= umbral_ambar; rojo en otro caso
semaforo.umbral_verde=100
semaforo.umbral_ambar=95

# --- Función objetivo y operación ---
# Penalidad por entrega tarde dentro del Split del AG (soles ficticios)
objetivo.penalidad_tardanza=1000000
# Horas de acondicionamiento por entrega (P11 y P14)
entrega.horas=1

# --- Experimento (modo estático) ---
# Presupuesto de tiempo Ta por corrida (ms)
experimento.ta_ms=10000
# Réplicas por combinación (IEN v01: 5); también se usa en el modo simulación
experimento.replicas=5
# Tope de evaluaciones por llamada al algoritmo: 0 = desactivado (se para por Ta).
# Si es > 0, se ignora Ta y la corrida es reproducible con su semilla.
experimento.max_evaluaciones=0
# Ventanas de las instancias: DdHHhMMm/duración_en_horas, separadas por coma.
# No deben superponerse. Por defecto, 3 ventanas de 1 h del día 1 dentro
# del rango del archivo sintético (08:00-12:00).
experimento.ventanas=1d08h00m/1,1d09h30m/1,1d11h00m/1

# --- Simulación (modo simulacion) ---
# Minutos simulados entre replanificaciones (Sa)
simulacion.sa_min=60
# Presupuesto Ta por llamada al planificador (ms). Ver justificación en docs/capacidad_y_carga.md
simulacion.ta_ms=2000
# Horizonte en minutos simulados (5 días = 7200); sin colapso -> corrida censurada
simulacion.horizonte_min=7200

# --- Generación de carga (niveles del IEN) ---
# Fuente de C_max: propio (cálculo del IEN) u hoja (1 536 de la hoja auxiliar, marcada REVISAR)
carga.cmax_fuente=propio
carga.cmax_hoja=1536
# Horas efectivas por día (24 h menos 3 turnos x 1 h de alimentación)
carga.horas_efectivas=21
# Fracción de C_max por día para cada nivel
carga.nivel.BAJA=0.30
carga.nivel.MEDIA=0.60
carga.nivel.ALTA=0.90
# Días generados y semilla base (el nivel k usa semilla_base + k, igual para ambos algoritmos)
carga.dias=5
carga.semilla_base=2026

# --- Búsqueda Tabú ---
# Duración tabú (iteraciones)
tabu.duracion=8
# Vecinos candidatos generados por iteración
tabu.candidatos=20
# Pesos relativos de los operadores (2-opt y cross son provisionales: verificar contra el ISA)
tabu.peso_reubicacion=0.35
tabu.peso_intercambio=0.35
tabu.peso_2opt=0.15
tabu.peso_cross=0.15

# --- Algoritmo Genético ---
ag.poblacion=30
# Búsqueda local memética: si | no
ag.busqueda_local=si
# Probabilidad de aplicarla a cada hijo (al mejor de cada generación se aplica siempre)
ag.prob_busqueda_local=0.2
# Movimientos (Reubicación / Intercambio) por aplicación
ag.movimientos_busqueda_local=30
# Si hay entregas sin asignar, 1 de cada 2 movimientos es una Inserción: si | no
# (sin ella, la búsqueda local empeoraba H en instancias con más carga que la flota)
ag.insercion_en_busqueda_local=si
